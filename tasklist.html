<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Service – Tasks</title>

    <style>
      :root {
        --primary: #2c5aa0;
        --accent: #28a745;
        --bg: #f8f9fa;
        --text-dark: #1e2a3a;
        --text-light: #6c757d;
      }

      body {
        margin: 0;
        background: var(--bg);
        font-family: "Inter", Arial, sans-serif;
        min-height: 100vh;
      }

      header {
        background: linear-gradient(135deg, var(--primary), #1e3d72);
        color: white;
        padding: 18px 20px;
        text-align: center;
        font-weight: 600;
        font-size: 1.2rem;
      }

      .tabs {
  display: flex;
  background: white;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);

  overflow-x: auto;        /* allow scrolling ONLY when needed */
  white-space: nowrap;     /* prevents line breaks */
  scrollbar-width: none;   /* hide scrollbar (Firefox) */
}

.tabs::-webkit-scrollbar {
  display: none;           /* hide scrollbar (Chrome/Safari) */
}

.tab {
  flex: 1 0 auto;           /* expand if space, shrink if not */
  min-width: 100px;         /* ensures tabs don't shrink too tiny */
  padding: 12px;
  text-align: center;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  color: var(--text-dark);
}


      .tab.active {
        color: var(--primary);
        border-bottom: 3px solid var(--primary);
      }

      .container {
        padding: 15px;
      }

      .task-card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 12px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        transition: 0.25s;
      }

      .task-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      }

      .task-title {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--primary);
      }

      .task-line {
        font-size: 0.9rem;
        color: var(--text-dark);
        margin-top: 4px;
      }

      .status-badge {
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        display: inline-block;
        margin-top: 6px;
      }

      .status-new {
        background: #d1ecf1;
        color: #0c5460;
      }
      .status-progress {
        background: #fff3cd;
        color: #856404;
      }
      .status-done {
        background: #d4edda;
        color: #155724;
      }

      .status-overdue {
        background: #f8d7da;
        color: #721c24;
      }

      .no-task {
        text-align: center;
        color: #777;
        padding: 20px;
      }

      /* Staff task discovery and keyboard accessibility. */
      .tab {
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        font: inherit;
      }
      .tab:focus-visible, .task-card:focus-visible, .retry-btn:focus-visible,
      #taskSearch:focus-visible {
        outline: 3px solid #174c95;
        outline-offset: 2px;
      }
      .toolbar {
        background: #fff;
        padding: 14px 15px 10px;
      }
      .toolbar label {
        display: block;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 6px;
      }
      #taskSearch {
        box-sizing: border-box;
        display: block;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #9daaba;
        border-radius: 8px;
        font: inherit;
      }
      .task-count {
        margin: 8px 0 0;
        color: var(--text-light);
        font-size: 0.85rem;
      }
      .task-card {
        display: block;
        width: 100%;
        border: 0;
        text-align: left;
        font: inherit;
      }
      .retry-btn {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .status-badge + .status-badge { margin-left: 6px; }
    </style>
  </head>

  <body>



    <div class="tabs" role="tablist" aria-label="Task categories">
      <button type="button" class="tab active" id="tabToday" data-filter="today" role="tab" aria-selected="true" aria-controls="taskList" tabindex="0">Today</button>
      <button type="button" class="tab" id="tabUpcoming" data-filter="upcoming" role="tab" aria-selected="false" aria-controls="taskList" tabindex="-1">Upcoming</button>
      <button type="button" class="tab" id="tabCompleted" data-filter="completed" role="tab" aria-selected="false" aria-controls="taskList" tabindex="-1">Completed</button>
      <button type="button" class="tab" id="tabPast" data-filter="past" role="tab" aria-selected="false" aria-controls="taskList" tabindex="-1">Past</button>
    </div>

    <div class="toolbar">
      <label for="taskSearch">Search tasks</label>
      <input type="search" id="taskSearch" placeholder="Client, location, status or ID" autocomplete="off" />
      <p class="task-count" id="taskCount" aria-live="polite"></p>
    </div>
    <div class="container" id="taskList" role="tabpanel" aria-labelledby="tabToday">Loading tasks...</div>



    <script src="tasklist-utils.js"></script>
    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbx5W0mk3v8kXHViNuOr4Qh50DpWl06aprkqt_W6qkPVqJyfbco3Yn5xPp3G9WE_QtZ6/exec";

      const { malaysiaToday, isDone, filterTasks } = window.TaskListUtils;
      const taskListEl = document.getElementById("taskList");
      const taskCountEl = document.getElementById("taskCount");
      const searchInput = document.getElementById("taskSearch");
      const tabs = Array.from(document.querySelectorAll(".tab"));

      let currentFilter = "today";
      let allTasks = [];
      let hasLoaded = false;

      function taskLine(label, value) {
        const line = document.createElement("div");
        line.className = "task-line";
        const strong = document.createElement("strong");
        strong.textContent = label + ":";
        line.append(strong, " " + (value == null || value === "" ? "-" : value));
        return line;
      }

      function statusBadge(status) {
        const badge = document.createElement("span");
        badge.className = "status-badge";
        const normalized = String(status || "").trim().toLowerCase();
        if (normalized === "done") {
          badge.classList.add("status-done");
          badge.textContent = "Done";
        } else if (normalized === "in progress") {
          badge.classList.add("status-progress");
          badge.textContent = "In Progress";
        } else {
          badge.classList.add("status-new");
          badge.textContent = status || "New";
        }
        return badge;
      }

      function renderTaskList(tasks) {
        taskListEl.replaceChildren();
        taskCountEl.textContent = tasks.length + " task" + (tasks.length === 1 ? "" : "s") + " shown";

        if (!tasks.length) {
          const empty = document.createElement("p");
          empty.className = "no-task";
          empty.textContent = searchInput.value.trim()
            ? "No tasks match your search in this tab."
            : "No tasks found for this tab.";
          taskListEl.appendChild(empty);
          return;
        }

        tasks.forEach(task => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "task-card";

          const title = document.createElement("div");
          title.className = "task-title";
          title.textContent = task.client || "Unnamed client";

          const statusLine = document.createElement("div");
          statusLine.className = "task-line";
          statusLine.appendChild(statusBadge(task.status));
          if (task.overdue && !isDone(task.status)) {
            const overdue = document.createElement("span");
            overdue.className = "status-badge status-overdue";
            overdue.textContent = "Overdue";
            statusLine.appendChild(overdue);
          }

          card.append(
            title,
            taskLine("Date", task.date),
            taskLine("Time", task.time),
            taskLine("Location", task.location),
            statusLine
          );
          card.addEventListener("click", () => {
            localStorage.setItem("selectedTask", JSON.stringify(task));
            window.location.href = "task-details.html";
          });
          taskListEl.appendChild(card);
        });
      }

      function renderByFilter() {
        if (!hasLoaded) return;
        const filtered = filterTasks(
          allTasks, currentFilter, searchInput.value, malaysiaToday()
        );
        renderTaskList(filtered);
      }

      function activateTab(tab, focus = false) {
        currentFilter = tab.dataset.filter;
        tabs.forEach(item => {
          const selected = item === tab;
          item.classList.toggle("active", selected);
          item.setAttribute("aria-selected", String(selected));
          item.tabIndex = selected ? 0 : -1;
        });
        taskListEl.setAttribute("aria-labelledby", tab.id);
        if (focus) tab.focus();
        renderByFilter();
      }

      function showLoadError() {
        taskListEl.replaceChildren();
        taskCountEl.textContent = "Unable to load tasks";
        const message = document.createElement("p");
        message.textContent = "Could not load tasks. Check your connection and try again.";
        const retry = document.createElement("button");
        retry.type = "button";
        retry.className = "retry-btn";
        retry.textContent = "Try again";
        retry.addEventListener("click", loadTasks);
        const wrapper = document.createElement("div");
        wrapper.className = "no-task";
        wrapper.append(message, retry);
        taskListEl.appendChild(wrapper);
      }

      async function loadTasks() {
        const email = localStorage.getItem("user_email");
        if (!email) {
          taskListEl.textContent = "Please sign in to view your assigned tasks.";
          taskCountEl.textContent = "";
          return;
        }

        hasLoaded = false;
        taskListEl.textContent = "Loading tasks...";
        taskCountEl.textContent = "";

        try {
          const query = new URLSearchParams({ action: "getAllTasks", email });
          const response = await fetch(SCRIPT_URL + "?" + query.toString());
          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();
          if (!data.success || !Array.isArray(data.tasks)) {
            throw new Error(data.message || "Unexpected task response");
          }
          allTasks = data.tasks;
          hasLoaded = true;
          renderByFilter();
        } catch (error) {
          console.error("Failed to load tasks:", error);
          showLoadError();
        }
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => activateTab(tab));
        tab.addEventListener("keydown", event => {
          let next = index;
          if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
          else if (event.key === "ArrowLeft") next = (index - 1 + tabs.length) % tabs.length;
          else if (event.key === "Home") next = 0;
          else if (event.key === "End") next = tabs.length - 1;
          else return;
          event.preventDefault();
          activateTab(tabs[next], true);
        });
      });

      searchInput.addEventListener("input", renderByFilter);
      document.addEventListener("DOMContentLoaded", loadTasks);
    </script>
    <script src="navbar.js"></script>
    <div style="height: 70px;"></div>


  </body>
</html>
